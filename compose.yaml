services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roomflow
      POSTGRES_USER: roomflow
      POSTGRES_PASSWORD: roomflow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomflow -d roomflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      APP_PORT: 8080
      DATABASE_URL: postgres://roomflow:roomflow@db:5432/roomflow?sslmode=disable
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s

  testdb:
    profiles: [test]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roomflow_test
      POSTGRES_USER: roomflow
      POSTGRES_PASSWORD: roomflow
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomflow -d roomflow_test"]
      interval: 2s
      timeout: 3s
      retries: 10

  test:
    profiles: [test]
    image: golang:1.27.3-alpine
    working_dir: /src
    volumes:
      - .:/src:ro
    environment:
      TEST_DATABASE_URL: postgres://roomflow:roomflow@testdb:5432/roomflow_test?sslmode=disable
    depends_on:
      testdb:
        condition: service_healthy
    command: ["go", "test", "./..."]

volumes:
  postgres_data:
