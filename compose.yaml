services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roomflow
      POSTGRES_USER: roomflow
      POSTGRES_PASSWORD: roomflow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomflow -d roomflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      APP_PORT: 8080
      DATABASE_URL: postgres://roomflow:roomflow@db:5432/roomflow?sslmode=disable
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  postgres_data:
