openapi: 3.1.0
info:
  title: RoomFlow API
  version: 1.0.0
  description: |
    API REST para salas e reservas. Reservas usam intervalos com início inclusivo
    e fim exclusivo (`[)`). Uma constraint no PostgreSQL impede sobreposições de
    reservas ativas da mesma sala, inclusive em requisições concorrentes.
    Cancelar mantém o histórico e libera o intervalo. Salas com qualquer reserva,
    mesmo cancelada, não podem ser excluídas. Corpos JSON devem ser objetos sem
    campos desconhecidos ou repetidos e têm limite de 1 MiB.
servers:
  - url: http://localhost:8080
tags:
  - name: Saúde
  - name: Salas
  - name: Reservas
paths:
  /healthz:
    get:
      tags: [Saúde]
      summary: Verifica a API e a conexão com PostgreSQL
      operationId: getHealth
      responses:
        '200':
          description: API e banco disponíveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                data:
                  status: ok
        '503':
          description: Banco indisponível; código `service_unavailable`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: service_unavailable
                  message: database unavailable
  /rooms:
    post:
      tags: [Salas]
      summary: Cria uma sala
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
            example:
              name: Sala Azul
              capacity: 8
      responses:
        '201':
          description: Sala criada.
          headers:
            Location:
              description: Caminho da sala criada.
              schema:
                type: string
              example: /rooms/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          description: JSON inválido, campo desconhecido ou sala inválida (`invalid_json`, `invalid_room`).
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Salas]
      summary: Lista salas por ID
      operationId: listRooms
      responses:
        '200':
          description: Lista de salas; `data` é `[]` se estiver vazia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/PositiveID'
    get:
      tags: [Salas]
      summary: Consulta uma sala
      operationId: getRoom
      responses:
        '200':
          description: Sala encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Sala inexistente (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Salas]
      summary: Atualiza nome e/ou capacidade
      description: Campos ausentes são preservados. Objeto vazio e valores `null` são rejeitados.
      operationId: updateRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomPatch'
            example:
              capacity: 10
      responses:
        '200':
          description: Sala atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Sala inexistente (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Salas]
      summary: Exclui uma sala sem histórico de reservas
      operationId: deleteRoom
      responses:
        '204':
          description: Sala excluída; sem corpo de resposta.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Sala inexistente (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sala possui reservas, inclusive canceladas (`room_has_reservations`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: room_has_reservations
                  message: room has reservations
        '500':
          $ref: '#/components/responses/InternalError'
  /reservations:
    post:
      tags: [Reservas]
      summary: Cria uma reserva
      description: |
        Datas RFC3339 exigem timezone explícito. Não há limite máximo de duração
        nem proibição de datas no passado. O fim deve ser posterior ao início.
        A resposta normaliza timestamps para UTC.
      operationId: createReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationInput'
            example:
              room_id: 1
              starts_at: '2026-11-10T09:00:00Z'
              ends_at: '2026-11-10T10:00:00Z'
      responses:
        '201':
          description: Reserva criada.
          headers:
            Location:
              description: Caminho da reserva criada.
              schema:
                type: string
              example: /reservations/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          description: JSON inválido ou dados inconsistentes (`invalid_json`, `invalid_reservation`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sala inexistente (`room_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: room_not_found
                  message: room not found
        '409':
          description: Período sobreposto na mesma sala (`reservation_conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: reservation_conflict
                  message: reservation overlaps an active reservation
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Reservas]
      summary: Lista reservas por início e, em caso de empate, por ID
      operationId: listReservations
      responses:
        '200':
          description: Lista inclui reservas canceladas; `data` é `[]` se estiver vazia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /reservations/{id}:
    parameters:
      - $ref: '#/components/parameters/PositiveID'
    get:
      tags: [Reservas]
      summary: Consulta uma reserva, inclusive cancelada
      operationId: getReservation
      responses:
        '200':
          description: Reserva encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Reserva inexistente (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /reservations/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/PositiveID'
    post:
      tags: [Reservas]
      summary: Cancela uma reserva sem apagar o histórico
      description: "`cancelled_at` usa o horário do PostgreSQL. Um segundo cancelamento preserva esse valor."
      operationId: cancelReservation
      responses:
        '200':
          description: Reserva cancelada, com `cancelled_at` em UTC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Reserva inexistente (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Reserva já cancelada (`already_cancelled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: already_cancelled
                  message: reservation already cancelled
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    PositiveID:
      name: id
      in: path
      required: true
      description: ID inteiro positivo; valores inválidos retornam `400` (`invalid_id`).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
  responses:
    BadRequest:
      description: Requisição inválida (`invalid_id`, `invalid_json`, `invalid_room` ou `invalid_reservation`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Falha inesperada (`internal_error`); detalhes internos não são expostos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_error
              message: internal server error
  schemas:
    RoomInput:
      type: object
      additionalProperties: false
      required: [name, capacity]
      properties:
        name:
          type: string
          minLength: 1
          description: Espaços nas bordas são removidos; apenas espaços ou byte NUL são inválidos.
          example: Sala Azul
        capacity:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          example: 8
    RoomPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          description: Não pode conter apenas espaços nem byte NUL.
          example: Sala Verde
        capacity:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          example: 10
    Room:
      type: object
      additionalProperties: false
      required: [id, name, capacity]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        capacity:
          type: integer
          format: int32
          minimum: 1
    ReservationInput:
      type: object
      additionalProperties: false
      required: [room_id, starts_at, ends_at]
      properties:
        room_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        starts_at:
          type: string
          format: date-time
          description: RFC3339 com timezone explícito; início inclusivo.
          example: '2026-11-10T09:00:00Z'
        ends_at:
          type: string
          format: date-time
          description: RFC3339 com timezone explícito; fim exclusivo e posterior ao início.
          example: '2026-11-10T10:00:00Z'
    Reservation:
      type: object
      additionalProperties: false
      required: [id, room_id, starts_at, ends_at, cancelled_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        room_id:
          type: integer
          format: int64
          minimum: 1
        starts_at:
          type: string
          format: date-time
          description: UTC.
        ends_at:
          type: string
          format: date-time
          description: UTC.
        cancelled_at:
          type: [string, 'null']
          format: date-time
          description: UTC quando cancelada; `null` quando ativa.
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              const: ok
    RoomResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Room'
    RoomsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Room'
    ReservationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Reservation'
    ReservationsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - service_unavailable
                - method_not_allowed
                - not_found
                - invalid_id
                - invalid_json
                - invalid_room
                - invalid_reservation
                - room_has_reservations
                - reservation_conflict
                - room_not_found
                - already_cancelled
                - internal_error
              example: reservation_conflict
            message:
              type: string
              example: reservation overlaps an active reservation
